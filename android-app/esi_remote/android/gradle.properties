org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# These newDsl flags were added by the Flutter template.
# `android.newDsl=false` opts out of AGP 9's new DSL, which the Flutter Gradle plugin does
# not read yet (https://github.com/flutter/flutter/issues/180137).
android.newDsl=false
# The same migration is in progress for AGP 9's built-in Kotlin support.
android.builtInKotlin=false

# `android_file_picker` pins Kotlin Gradle plugin 1.8.22 in its own `buildscript` block.
# That daemon predates Gradle 9 and crashes while closing its incremental caches, even
# though compilation itself succeeds. Compiling in-process removes the daemon entirely.
# Both settings are safe on their own merits: the incremental cache is the thing that was
# failing.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
